<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="primeSmallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="primeSmallShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#primeSmallGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="url(#primeSmallShadow)"/>

  <!-- Academic Graduation Cap -->
  <!-- Mortarboard Diamond Top -->
  <polygon points="32,13 11,24 32,35 53,24" fill="#FFFFFF"/>
  
  <!-- Mortarboard Base / Bowl -->
  <path d="M17,27 L19.5,39 C21,43.5 43,43.5 44.5,39 L47,27 C42.5,30.5 21.5,30.5 17,27 Z" fill="#FDB813"/>
  
  <!-- Tassel Cord & Bobble -->
  <path d="M32,24 C38.5,24 47,25.5 48.5,28.5 C49.5,31 49,35 48,39" fill="none" stroke="#FDB813" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="48" cy="40" r="2" fill="#FDB813"/>
  <polygon points="46.5,41.5 49.5,41.5 49,47 47,47" fill="#FDB813"/>
  
  <!-- Center Cap Button -->
  <circle cx="32" cy="24" r="1.8" fill="#FDB813"/>
  
  <!-- Hanging White Diamond Accent -->
  <polygon points="32,43 36,48.5 32,54 28,48.5" fill="#FFFFFF"/>
</svg>
