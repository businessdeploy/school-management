<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 51" width="100%" height="100%" preserveAspectRatio="xMinYMid meet">
  <defs>
    <linearGradient id="primeIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="primeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect x="0.5" y="0.5" width="289" height="50" rx="12" fill="#111625" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Icon Badge -->
  <g transform="translate(8, 7)">
    <!-- Icon Rounded Square -->
    <rect width="37" height="37" rx="9" fill="url(#primeIconGrad)" filter="url(#primeShadow)"/>
    
    <!-- Academic Cap Diamond -->
    <polygon points="18.5,7.5 6,14 18.5,20.5 31,14" fill="#FFFFFF"/>
    
    <!-- Cap Base / Bowl -->
    <path d="M10,16 L11.5,23 C12.5,25.5 24.5,25.5 25.5,23 L27,16 C24.5,18.2 12.5,18.2 10,16 Z" fill="#FDB813"/>
    
    <!-- Tassel Cord & Fringe -->
    <path d="M18.5,14 C22.5,14 27.5,15 28.5,17 C29.2,18.5 29,21 28.5,23" fill="none" stroke="#FDB813" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="28.5" cy="23.5" r="1.1" fill="#FDB813"/>
    <polygon points="27.5,24.5 29.5,24.5 29,28 28,28" fill="#FDB813"/>
    
    <!-- Center Button -->
    <circle cx="18.5" cy="14" r="1" fill="#FDB813"/>
    
    <!-- Hanging Diamond Accent -->
    <polygon points="18.5,25.5 21,28.8 18.5,32 16,28.8" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(54, 0)">
    <text x="0" y="26.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="19" letter-spacing="0.5">
      <tspan fill="#FFFFFF">PRIME </tspan>
      <tspan fill="#FDB813">SCHOOL</tspan>
    </text>
    <text x="0" y="39.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="7.5" fill="#94A3B8" letter-spacing="0.8">PRIMESKILL SOLUTIONS PRIVATE LIMITED</text>
  </g>
</svg>
